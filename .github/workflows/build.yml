# DSH 提示词优化助手 - CI/CD 工作流
# 提交自动构建（typecheck + build + 冒烟测试），打 Tag 自动发布 GitHub Release
name: Build & Release

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]

# 同一分支/标签的并发构建，新的会取消旧的
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test
        run: node scripts/smoke-test.cjs

      # ============ 仅 Tag 推送时执行：打包发布产物 ============
      - name: Package plugin artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release
          # npm tarball（DSH 支持 dsh plugin add ./xxx.tgz）
          npm pack --pack-destination release
          # 手动解压安装包（zip，含 dist 与 bundle 声明）
          zip -r "release/prompt-optimizer-${{ github.ref_name }}.zip" \
            dist cordis.patch.yml cordis.yml icon.svg \
            package.json README.md CHANGELOG.md LICENSE

      # ============ 仅 Tag 推送时执行：发布 GitHub Release ============
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## DSH 提示词优化助手 ${{ github.ref_name }}

            兼容 DSH 桌面端 v0.2.0-rc.2。安装方式：

            ```bash
            # 方式一：tarball
            dsh plugin add ./prompt-optimizer-${{ github.ref_name }}.tgz

            # 方式二：解压 zip 后指向目录
            dsh plugin add ./解压后的目录路径
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
